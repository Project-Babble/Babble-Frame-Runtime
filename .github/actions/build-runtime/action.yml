name: Build Babble Frame Runtime
description: >-
  Builds the ExecuTorch runtime (cached per pinned submodule commit), then the
  Babble runtime, the SteamVR driver shim and the assembled driver folder for
  linuxarm64. Must run on an arm64 Linux runner.

inputs:
  build-type:
    description: CMake build type for the runtime and driver
    required: false
    default: Release
  version:
    description: >-
      Release version, "Vx.x Stage [N]" or "Vx.x-Stage[-N]" (Stage: Alpha, Beta,
      RC, Release; N optional, e.g. V0.1-Alpha-2). Empty builds the VERSION file's version, marked as a dev build.
    required: false
    default: ''

outputs:
  package-dir:
    description: The assembled SteamVR driver folder (build/babble)
    value: ${{ steps.paths.outputs.package-dir }}

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libvulkan-dev python3-venv

    - name: Resolve paths and cache key
      id: paths
      shell: bash
      run: |
        echo "et-prefix=${RUNNER_TEMP}/et-install" >> "$GITHUB_OUTPUT"
        echo "et-build=${RUNNER_TEMP}/et-build" >> "$GITHUB_OUTPUT"
        echo "et-venv=${RUNNER_TEMP}/et-venv" >> "$GITHUB_OUTPUT"
        echo "et-sha=$(git rev-parse HEAD:third_party/executorch)" >> "$GITHUB_OUTPUT"
        echo "package-dir=${GITHUB_WORKSPACE}/build/babble" >> "$GITHUB_OUTPUT"

    # ExecuTorch (XNNPACK + the selected portable kernels) takes far longer to
    # build than the runtime itself, so its install prefix is cached. The key
    # changes whenever the pinned ExecuTorch commit or the build script changes.
    - name: Restore ExecuTorch build
      id: et-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.paths.outputs.et-prefix }}
        key: executorch-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.et-sha }}-${{ hashFiles('tools/build_executorch.sh') }}

    - name: Set up build tools
      shell: bash
      run: |
        python3 -m venv "${{ steps.paths.outputs.et-venv }}"
        "${{ steps.paths.outputs.et-venv }}/bin/pip" install --upgrade pip
        # ExecuTorch's vendored third-party projects still need a pre-4.0 CMake.
        "${{ steps.paths.outputs.et-venv }}/bin/pip" install "cmake>=3.24,<4" ninja
        echo "${{ steps.paths.outputs.et-venv }}/bin" >> "$GITHUB_PATH"

    - name: Install torch for the ExecuTorch kernel code generator
      if: steps.et-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Build-time only: ExecuTorch generates its kernel registration code
        # with torchgen, which ships inside the torch wheel. The binaries this
        # action produces do not depend on torch. CPU wheel, pinned version
        # first (the one this ExecuTorch commit was released against).
        pip install pyyaml
        pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu \
          || pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -c "import torch, torchgen; print('torch', torch.__version__)"

    - name: Build ExecuTorch
      if: steps.et-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ET_PYTHON: ${{ steps.paths.outputs.et-venv }}/bin/python
        ET_BUILD_DIR: ${{ steps.paths.outputs.et-build }}
        CMAKE_GENERATOR: Ninja
      run: tools/build_executorch.sh "${{ steps.paths.outputs.et-prefix }}"

    - name: Configure
      shell: bash
      run: >-
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}
        -DBABBLE_EXECUTORCH_PREFIX=${{ steps.paths.outputs.et-prefix }}
        "-DBABBLE_VERSION=${{ inputs.version }}"

    - name: Build runtime, driver shim and driver folder
      shell: bash
      run: cmake --build build --parallel

    - name: Show driver folder
      shell: bash
      run: |
        find build/babble -type f | sort
        file build/babble/bin/linuxarm64/babble-runtime build/babble/bin/linuxarm64/driver_babble.so build/babble/bin/linuxarm64/babble-setup
