name: Build

# Manual release pipeline, modelled on Baballonia's: build the driver folder,
# then optionally publish it as a GitHub release and/or push it to Steam.

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: 'Publish Release'
        type: boolean
        default: false
      publish-pre-release:
        description: 'Mark as Pre-Release'
        type: boolean
        default: false
      version-number:
        description: 'Version Number for Release, "Vx.x-Stage[-N]" (Stage: Alpha, Beta, RC, Release; e.g. V0.1-Alpha-2)'
        type: string
      release-name-info:
        description: 'Additional info to put at the end of the release name'
        type: string
        required: false
      release-notes:
        description: 'Release notes, auto generated if not given'
        type: string
        required: false
      publish-steam:
        description: 'Publish on Steam'
        type: boolean
        default: false
      steam-branch:
        description: 'Steam branch to set the build live on (must already exist)'
        type: string
        default: prerelease
      set-live:
        description: 'Set the build live on that branch (untick to only upload)'
        type: boolean
        default: true

env:
  ARTIFACT: babble-frame-runtime.linuxarm64.tar.xz

jobs:
  build-linuxarm64:
    defaults:
      run:
        shell: bash

    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout latest
        uses: actions/checkout@v5
        with:
          submodules: true
          lfs: true

      - name: Check the LFS models were fetched
        run: |
          for f in runtime/resources/models/*.pte; do
            if head -c 64 "$f" | grep -q 'git-lfs'; then
              echo "::error::$f is an unresolved Git LFS pointer"
              exit 1
            fi
          done

      - name: Build
        uses: ./.github/actions/build-runtime
        with:
          version: ${{ github.event.inputs.version-number }}

      # The tarball unpacks to babble/, the SteamVR driver folder, next to the
      # scripts for installing it by hand (one-off builds; Steam gets babble/ only):
      #   babble/driver.vrdrivermanifest
      #   babble/bin/linuxarm64/{driver_babble.so,babble-runtime,babble-setup,libopenvr_api.so}
      #   babble/resources/...
      #   install.sh, uninstall.sh
      - name: Package driver folder
        run: |
          cp tools/install.sh tools/uninstall.sh build/
          tar -C build -cJf "${ARTIFACT}" babble install.sh uninstall.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}

  publish-release:
    needs: [build-linuxarm64]
    if: ${{ github.event.inputs.publish-release == 'true' }}
    defaults:
      run:
        shell: bash

    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Validate version number exists
        run: |
          if [ -z "${{ github.event.inputs.version-number }}" ]; then
            echo "::error::version-number is required to publish a release"
            exit 1
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ./artifacts

      - name: Rename artifact
        env:
          VERSION: ${{ github.event.inputs.version-number }}
        run: |
          cd artifacts
          mv "${ARTIFACT}" "babble-frame-runtime.linuxarm64.${VERSION}.tar.xz"

      - name: Set dynamic release name
        id: release-name
        run: |
          if [[ -z "${{ github.event.inputs.release-name-info }}" ]]; then
            echo "name=${{ github.event.inputs.version-number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.version-number }} - ${{ github.event.inputs.release-name-info }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set release body or generate notes
        id: release-body
        run: |
          if [[ -z "${{ github.event.inputs.release-notes }}" ]]; then
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            echo "generate_notes=false" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.inputs.release-notes }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/babble-frame-runtime.linuxarm64.${{ github.event.inputs.version-number }}.tar.xz
          tag_name: ${{ github.event.inputs.version-number }}
          name: ${{ steps.release-name.outputs.name }}
          prerelease: ${{ github.event.inputs.publish-pre-release }}
          body: ${{ steps.release-body.outputs.body }}
          generate_release_notes: ${{ steps.release-body.outputs.generate_notes }}

  publish-steam:
    needs: [build-linuxarm64]
    if: ${{ github.event.inputs.publish-steam == 'true' }}
    defaults:
      run:
        shell: bash

    runs-on: ubuntu-22.04

    steps:
      # Repository secrets: STEAM_USERNAME, STEAM_CONFIG_VDF (same as Baballonia).
      # Repository variables: STEAM_APP_ID (required) and STEAM_DEPOT_ID
      # (optional; defaults to STEAM_APP_ID + 1, the first depot of a standard app).
      # Steam only shows branch controls once a build exists, so the very first
      # upload has to run with set-live unticked; create the branch on the
      # Builds page afterwards and later uploads can set live on it.
      - name: Validate version number and Steam configuration
        run: |
          if [ -z "${{ github.event.inputs.version-number }}" ]; then
            echo "::error::version-number is required to publish on Steam"
            exit 1
          fi
          if [ -z "${{ vars.STEAM_APP_ID }}" ]; then
            echo "::error::The STEAM_APP_ID repository variable is not set"
            exit 1
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ./artifacts

      - name: Untar artifact
        run: |
          mkdir -p ./builds
          tar -xf "./artifacts/${ARTIFACT}" --directory ./builds
          find ./builds -type f | sort

      - name: Upload to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ vars.STEAM_APP_ID }}
          firstDepotIdOverride: ${{ vars.STEAM_DEPOT_ID }}
          buildDescription: ${{ github.event.inputs.version-number }}
          depot1Path: builds/babble
          depot1InstallScriptPath: builds/babble/installscript.vdf
          releaseBranch: ${{ github.event.inputs.set-live == 'true' && github.event.inputs.steam-branch || '' }}
