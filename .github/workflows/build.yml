name: Build

# This manual workflow builds the driver folder and can publish it as a GitHub release or to Steam.

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: 'Publish Release'
        type: boolean
        default: false
      publish-pre-release:
        description: 'Mark as Pre-Release'
        type: boolean
        default: false
      version-number:
        description: 'Version Number for Release, "Vx.x-Stage[-N]" (Stage: Alpha, Beta, RC, Release; e.g. V0.1-Alpha-2). Empty: the VERSION file'
        type: string
        required: false
      release-name-info:
        description: 'Additional info to put at the end of the release name'
        type: string
        required: false
      release-notes:
        description: 'Release notes, auto generated if not given'
        type: string
        required: false
      publish-steam:
        description: 'Publish on Steam'
        type: boolean
        default: false
      steam-branch:
        description: 'Steam branch to set the build live on (must already exist)'
        type: string
        default: prerelease
      set-live:
        description: 'Set the build live on that branch (untick to only upload)'
        type: boolean
        default: true

env:
  ARTIFACT: babble-frame-runtime.linuxarm64.tar.xz

jobs:
  build-linuxarm64:
    defaults:
      run:
        shell: bash

    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout latest
        uses: actions/checkout@v5
        with:
          submodules: true
          lfs: true

      # Use the input version or the VERSION file, in the git-tag format ("V1.0-Alpha-4").
      - name: Resolve the version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version-number }}
        run: |
          v="${INPUT:-$(head -n1 VERSION)}"
          v="$(echo "$v" | xargs | tr ' ' '-')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Check the LFS models were fetched
        run: |
          for f in runtime/resources/models/*.pte; do
            if head -c 64 "$f" | grep -q 'git-lfs'; then
              echo "::error::$f is an unresolved Git LFS pointer"
              exit 1
            fi
          done

      # Releases use the release profile, which has only the USB Babble mouth tracker and VRCFaceTracking output.
      - name: Build
        uses: ./.github/actions/build-runtime
        with:
          version: ${{ steps.version.outputs.version }}
          profile: release

      - name: Run the unit tests
        run: build/runtime/babble_tests

      # The tarball holds the babble/ driver folder and the scripts that install it by hand.
      - name: Package driver folder
        run: |
          cp tools/install.sh tools/uninstall.sh build/
          tar -C build -cJf "${ARTIFACT}" babble install.sh uninstall.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}

  publish-release:
    needs: [build-linuxarm64]
    if: ${{ github.event.inputs.publish-release == 'true' }}
    defaults:
      run:
        shell: bash

    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ./artifacts

      - name: Rename artifact
        env:
          VERSION: ${{ needs.build-linuxarm64.outputs.version }}
        run: |
          cd artifacts
          mv "${ARTIFACT}" "babble-frame-runtime.linuxarm64.${VERSION}.tar.xz"
          # tools/get.sh and the runtime updater use this checksum to examine the download.
          sha256sum "babble-frame-runtime.linuxarm64.${VERSION}.tar.xz" > "babble-frame-runtime.linuxarm64.${VERSION}.tar.xz.sha256"

      - name: Set dynamic release name
        id: release-name
        run: |
          if [[ -z "${{ github.event.inputs.release-name-info }}" ]]; then
            echo "name=${{ needs.build-linuxarm64.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ needs.build-linuxarm64.outputs.version }} - ${{ github.event.inputs.release-name-info }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set release body or generate notes
        id: release-body
        run: |
          if [[ -z "${{ github.event.inputs.release-notes }}" ]]; then
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            echo "generate_notes=false" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.inputs.release-notes }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/babble-frame-runtime.linuxarm64.${{ needs.build-linuxarm64.outputs.version }}.tar.xz
            artifacts/babble-frame-runtime.linuxarm64.${{ needs.build-linuxarm64.outputs.version }}.tar.xz.sha256
          tag_name: ${{ needs.build-linuxarm64.outputs.version }}
          name: ${{ steps.release-name.outputs.name }}
          prerelease: ${{ github.event.inputs.publish-pre-release }}
          body: ${{ steps.release-body.outputs.body }}
          generate_release_notes: ${{ steps.release-body.outputs.generate_notes }}

  publish-steam:
    needs: [build-linuxarm64]
    if: ${{ github.event.inputs.publish-steam == 'true' }}
    defaults:
      run:
        shell: bash

    runs-on: ubuntu-22.04

    steps:
      # Run the first upload with set-live off because Steam shows branch controls only after a build exists.
      - name: Validate Steam configuration
        run: |
          if [ -z "${{ vars.STEAM_APP_ID }}" ]; then
            echo "::error::The STEAM_APP_ID repository variable is not set"
            exit 1
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ./artifacts

      - name: Untar artifact
        run: |
          mkdir -p ./builds
          tar -xf "./artifacts/${ARTIFACT}" --directory ./builds
          find ./builds -type f | sort

      - name: Upload to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ vars.STEAM_APP_ID }}
          firstDepotIdOverride: ${{ vars.STEAM_DEPOT_ID }}
          buildDescription: ${{ needs.build-linuxarm64.outputs.version }}
          depot1Path: builds/babble
          depot1InstallScriptPath: builds/babble/installscript.vdf
          releaseBranch: ${{ github.event.inputs.set-live == 'true' && github.event.inputs.steam-branch || '' }}
