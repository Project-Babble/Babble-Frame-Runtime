name: CI

# This workflow makes sure that the runtime, the driver shim and the unit tests compile in the dev and release profiles.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linuxarm64:
    name: Build (linuxarm64, ${{ matrix.profile }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Get only the direct submodules because tools/build_executorch.sh gets the nested dependencies.
          submodules: true

      - name: Build
        uses: ./.github/actions/build-runtime
        with:
          profile: ${{ matrix.profile }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: babble-frame-runtime-bin-linuxarm64-${{ matrix.profile }}
          path: build/babble/bin/linuxarm64
          retention-days: 7
