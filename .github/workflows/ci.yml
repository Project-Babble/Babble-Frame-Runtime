name: CI

# Checks that the runtime, the SteamVR driver shim and the unit-test binary
# still compile on every push and pull request, in both build profiles (dev
# with everything, release with the USB mouth tracker only). Nothing is executed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linuxarm64:
    name: Build (linuxarm64, ${{ matrix.profile }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Direct submodules only; tools/build_executorch.sh fetches the
          # nested ExecuTorch dependencies it needs. The models are Git LFS
          # and a compile check does not need them, so LFS is left off.
          submodules: true

      - name: Build
        uses: ./.github/actions/build-runtime
        with:
          profile: ${{ matrix.profile }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: babble-frame-runtime-bin-linuxarm64-${{ matrix.profile }}
          path: build/babble/bin/linuxarm64
          retention-days: 7
